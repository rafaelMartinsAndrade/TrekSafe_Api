services:
  db:
    image: postgres:15
    container_name: treksafe-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=treksafe_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d treksafe_db']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: node:18
    container_name: treksafe-api
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=5000
      - JWT_SECRET=treksafe_secret_key_change_in_production
      - JWT_EXPIRE=24h
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/treksafe_db?schema=public
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    ports:
      - '5000:5000'
    command: sh -lc "npm install && npm run migrate && npm run dev:prisma"
    restart: unless-stopped

volumes:
  pgdata:
  api_node_modules:

